[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shweather"
version = "0.3.0"
description = "Self-hosted, offline-first marine weather for a Raspberry Pi or Windows PC aboard your boat"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Tyler Nowak" }]
keywords = ["weather", "marine", "sailing", "raspberry-pi", "nmea", "signalk", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# NMEA 0183 over a USB/RS-422 serial adapter
serial = ["pyserial>=3.5"]
# BME280 barometer/thermometer on the Pi's I2C bus
bme280 = ["RPi.bme280>=0.2.4; sys_platform == 'linux'", "smbus2>=0.4; sys_platform == 'linux'"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
shweather = "shweather.__main__:main"

[project.urls]
Homepage = "https://github.com/TylerNowak/SHWeather"
Issues = "https://github.com/TylerNowak/SHWeather/issues"

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["server", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
